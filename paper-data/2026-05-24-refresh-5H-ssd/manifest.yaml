tag: 2026-05-24-refresh-5H-ssd
experiment: refresh_sales (TPC-H RF1/RF2 update throughput) — 5H cell (c3) — REAL SSD
commit_sha: 83240c0a
host: c220g2-011011.wisc.cloudlab.us
disk: ssd (Intel DC S3500 480GB SATA)
cell: c3 (5H = ~5 GiB secondaries, DRAM 0.4 GiB — same SF as 5L/c0, tighter pool)
scale_factor: {btree: 1550, lsm: 3850}
dram_gib: 0.4
refresh_seconds: 90
update_size: 1
backends: btree, lsm
structures: {1: split_S1, 2: view_S2, 3: merged_S3, 4: base_S4}
metric: count-based throughput over actual elapsed; pair_tps = #iterations/elapsed (size-stable RF1+RF2 pair); RF2 does NOT exhaust at this scale.
source_image: recovered from existing tpch family image (shared adapter names) on a per-structure copy; canonical read images untouched. OS page cache dropped between copy and run.
note: same working set as 5L (c0); only the buffer pool shrinks 1.0->0.4 GiB, so divergence from the 5L ordering is a pure memory-pressure effect. Both engines use direct I/O (RocksDB use_direct_reads=true, RocksDB.cpp:16; LeanStore O_DIRECT).
